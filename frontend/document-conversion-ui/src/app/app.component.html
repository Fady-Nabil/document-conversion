<div class="app-shell">
  <header class="app-header">
    <div class="app-header-inner">
      <a routerLink="/" class="app-brand">
        <span class="app-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M7 3.5h7.2L19 8.2V20a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 6 20V5a1.5 1.5 0 0 1 1-1.5Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M14 3.6V8h4.6" stroke="currentColor" stroke-width="1.6"/>
            <path d="M9 13h6M9 16.5h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="app-wordmark">
          <strong>Document Conversion</strong>
          <span>PDF to DOCX studio</span>
        </span>
      </a>
      <nav class="app-nav">
        <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Convert</a>
        <a routerLink="/jobs" routerLinkActive="is-active">History</a>
      </nav>
    </div>
  </header>
  <main class="app-main">
    <router-outlet />
  </main>
</div>
